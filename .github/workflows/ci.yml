name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env.local
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Database and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env.local

      - name: Start local Supabase
        run: pnpm exec supabase start --exclude studio,imgproxy,mailpit,postgres-meta,logflare,vector,supavisor
      - name: Check migrations match the generated types
        run: |
          pnpm db:types
          git diff --exit-code src/lib/supabase/database.types.ts
      - name: Database access rules (pgTAP)
        run: pnpm test:db

      - run: pnpm seed:demo
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests (phone and desktop)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
